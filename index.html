<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study Planner</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="planner-card">
        <h1 class="text-4xl font-bold text-center mb-10">Smart Study Planner</h1>

        <!-- Add New Task Section -->
        <div class="mb-10">
            <h2 class="text-2xl font-semibold mb-4">Add a New Task</h2>
            <form id="task-form" class="space-y-4 md:space-y-0 md:flex md:space-x-4">
                <input type="text" id="task-name" placeholder="Task Name" required class="input-field md:flex-1">
                <input type="date" id="task-date" required class="input-field md:w-48">
                <button type="submit" class="btn-primary w-full md:w-auto">Add Task</button>
            </form>
        </div>

        <!-- Today's Focus Section -->
        <div class="mb-10 p-6 rounded-xl bg-purple-700 bg-opacity-40 border border-purple-500 hidden" id="focus-section">
            <h2 class="text-xl font-semibold mb-2">💡 Today's Focus</h2>
            <div class="flex items-center space-x-4">
                <p id="focus-task" class="text-lg font-medium"></p>
                <p id="focus-date" class="text-sm opacity-80"></p>
            </div>
        </div>

        <!-- Progress Bar Section -->
        <div class="mb-6">
            <h2 class="text-2xl font-semibold mb-2">Progress</h2>
            <div class="w-full bg-gray-500 h-6 rounded-full overflow-hidden">
                <div id="progress-bar" class="bg-green-500 h-6 w-0 transition-all"></div>
            </div>
        </div>

        <!-- Task List & Timeline -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <div>
                <h2 class="text-2xl font-semibold mb-4">All Tasks</h2>
                <div id="task-list" class="space-y-4">
                    <!-- Tasks will be rendered here -->
                </div>
                <div id="no-tasks-message" class="text-center mt-10 text-gray-400 hidden">
                    <p>You have no tasks. Add one to get started!</p>
                </div>
            </div>

            <div>
                <h2 class="text-2xl font-semibold mb-4">Upcoming Timeline</h2>
                <div id="timeline" class="space-y-4">
                    <!-- Timeline will be rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
